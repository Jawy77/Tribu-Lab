# =============================================================================
# 🛡️ Auditgate — Security Platform (reusable workflow, el "paved road")
# https://github.com/Jawy77/auditgate
#
# Cualquier repo lo consume con `auditgate init` o con ~15 lineas a mano:
#
#   jobs:
#     auditgate:
#       uses: Jawy77/auditgate/.github/workflows/security-platform.yml@<sha>
#       with:
#         platform-ref: <sha>          # el mismo SHA del `uses:`
#
# POLITICA (determinista, auditable):
#   BLOQUEA en PR  → secretos nuevos · SAST ERROR nuevos (diff-aware) ·
#                    vulns nuevas en dependencias · CRITICAL con fix en imagen ·
#                    reglas propias sin tests · actions sin pin por SHA ·
#                    tests de seguridad rotos
#   REPORTA        → todo lo demas va a Code Scanning (SARIF) y aparece en el PR
#   ASESORA (AI)   → agente de triage comenta veredicto/fix; nunca bloquea.
#                    Modelo a eleccion (Claude, Grok, OpenAI o API compatible).
#
# La deuda previa NO bloquea a nadie (baseline); lo nuevo SI.
# =============================================================================
name: "Auditgate Security Platform (reusable)"

on:
  workflow_call:
    inputs:
      # ── De donde salen las herramientas de Auditgate ─────────────────────
      platform-repository:
        description: "Repo de Auditgate (forks pueden apuntar al suyo)"
        type: string
        default: "Jawy77/auditgate"
      platform-ref:
        description: "SHA (o tag) de Auditgate; debe coincidir con el @ref del `uses:`"
        type: string
        default: "main"
      # ── Que escanear ─────────────────────────────────────────────────────
      python-version:
        type: string
        default: "3.12"
      requirements:
        description: "requirements*.txt a auditar (separados por espacio; '' = omitir)"
        type: string
        default: "requirements.txt"
      image-dockerfile:
        description: "Dockerfile de la imagen a construir y escanear ('' = omitir)"
        type: string
        default: ""
      image-context:
        type: string
        default: "."
      iac-dir:
        description: "Directorio Terraform para Checkov ('' = omitir)"
        type: string
        default: ""
      tests-path:
        description: "Tests de seguridad propios a correr con pytest ('' = omitir)"
        type: string
        default: ""
      enforce-pinned-actions:
        description: "Bloquear si los workflows del repo usan actions sin fijar por SHA (false = solo reportar mientras migras)"
        type: boolean
        default: true
      # ── Agente de triage (asesor, nunca bloquea) ──────────────────────────
      ai-triage:
        type: boolean
        default: true
      llm-provider:
        description: "anthropic | xai | openai | openai-compatible ('' = anthropic)"
        type: string
        default: ""
      llm-model:
        description: "Modelo del proveedor ('' = default de Claude; obligatorio en los demas)"
        type: string
        default: ""
      llm-base-url:
        description: "Endpoint propio para openai-compatible (Ollama, OpenRouter, vLLM...)"
        type: string
        default: ""
      llm-environment:
        description: "Environment de GitHub que guarda AUDITGATE_LLM_API_KEY (el vault)"
        type: string
        default: "auditgate"
      # ── Claude sin llave: Workload Identity Federation (opcional) ────────
      anthropic-organization-id:
        type: string
        default: ""
      anthropic-federation-rule-id:
        type: string
        default: ""
      anthropic-service-account-id:
        type: string
        default: ""
      anthropic-workspace-id:
        type: string
        default: ""
    secrets:
      AUDITGATE_LLM_API_KEY:
        description: >-
          Alternativa al Environment: pasar la llave desde el caller. Si el
          Environment `llm-environment` tiene el secreto, ese tiene prioridad.
        required: false
    outputs:
      gate:
        description: "passed | failed"
        value: ${{ jobs.security-gate.outputs.gate }}

# Minimo privilegio por defecto; cada job pide solo lo que necesita.
permissions:
  contents: read

env:
  IS_PR: ${{ github.event_name == 'pull_request' }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  PLATFORM_REPO: ${{ inputs.platform-repository }}
  # Herramientas de Auditgate (scripts, reglas, versiones) — fuera del codigo escaneado.
  AG: .auditgate

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  secrets:
    name: "🔑 Secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Auditgate (herramientas, version fijada)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.platform-repository }}
          ref: ${{ github.repository == inputs.platform-repository && github.sha || inputs.platform-ref }}
          path: .auditgate
          persist-credentials: false
          sparse-checkout: |
            scripts
            rules
            .github/ci
      - run: echo ".auditgate/" >> .git/info/exclude

      - name: Install gitleaks (version + checksum fijos)
        env:
          GL_VERSION: "8.30.1"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}"
          curl -sSfL -o "$RUNNER_TEMP/gl.tgz" "${base}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/gl.sha" "${base}/gitleaks_${GL_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep "linux_x64.tar.gz" gl.sha | awk '{print $1"  gl.tgz"}' | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP" gitleaks && sudo mv "$RUNNER_TEMP/gitleaks" /usr/local/bin/

      - name: Gitleaks — commits del PR (gate) / historial (reporte)
        run: |
          CFG=.gitleaks.toml
          [ -f "$CFG" ] || CFG="$AG/.gitleaks.toml"
          if [ "$IS_PR" = "true" ]; then
            RANGE="${BASE_SHA}..${{ github.event.pull_request.head.sha }}"
            EXIT=1
          else
            RANGE="--all"
            EXIT=0
          fi
          gitleaks git --config "$CFG" --log-opts="$RANGE" --redact \
            --report-format sarif --report-path gitleaks.sarif --exit-code "$EXIT"

      - name: TruffleHog — solo secretos verificados (gate)
        uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          extra_args: --only-verified
          version: "3.99.9" # sin esto la action baja la imagen :latest

      - name: Upload SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sarif-secrets
          path: gitleaks.sarif
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────────────
  sast:
    name: "🔍 SAST"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Auditgate (herramientas, version fijada)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.platform-repository }}
          ref: ${{ github.repository == inputs.platform-repository && github.sha || inputs.platform-ref }}
          path: .auditgate
          persist-credentials: false
          sparse-checkout: |
            scripts
            rules
            .github/ci
      - run: echo ".auditgate/" >> .git/info/exclude
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Instalar herramientas (aisladas con pipx; versiones de requirements-ci.txt)
        run: |
          pin() { grep -E "^$1(\[[^]]*\])?==" "$AG/.github/ci/requirements-ci.txt"; }
          pipx install "$(pin semgrep)"
          pipx install "$(pin bandit)"

      - name: Reglas a aplicar (Auditgate + las propias del repo)
        run: |
          CONFIGS="--config p/python --config $AG/rules/"
          # Reglas codificadas por el propio equipo (Find → Extract → Codify en su repo)
          if [ -d rules ] && [ "$GITHUB_REPOSITORY" != "$PLATFORM_REPO" ]; then
            CONFIGS="$CONFIGS --config rules/"
          fi
          echo "SEMGREP_CONFIGS=$CONFIGS" >> "$GITHUB_ENV"

      - name: Semgrep — reporte completo (SARIF → Code Scanning)
        run: |
          read -ra CONFIGS <<< "$SEMGREP_CONFIGS --config p/secrets"
          semgrep scan "${CONFIGS[@]}" --exclude "$AG" --metrics=off --sarif -o semgrep.sarif || true
          # `|| true` SOLO en el reporte: el gate es el paso siguiente.

      - name: Semgrep — gate diff-aware (solo hallazgos ERROR nuevos)
        if: env.IS_PR == 'true'
        run: |
          read -ra CONFIGS <<< "$SEMGREP_CONFIGS"
          semgrep scan "${CONFIGS[@]}" --exclude "$AG" --metrics=off --severity ERROR \
            --baseline-commit "$BASE_SHA" --error

      - name: Bandit — reporte (SARIF)
        run: bandit -r . -x "./tests,./rules,./.venv,./$AG" -f sarif -o bandit.sarif --exit-zero

      - name: Upload SARIF (Semgrep)
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Upload SARIF (Bandit)
        if: always() && hashFiles('bandit.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: bandit.sarif
          category: bandit

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sarif-sast
          path: "*.sarif"
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────────────
  dependencies:
    name: "📦 Dependencies"
    if: inputs.requirements != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Auditgate (herramientas, version fijada)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.platform-repository }}
          ref: ${{ github.repository == inputs.platform-repository && github.sha || inputs.platform-ref }}
          path: .auditgate
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/ci
      - run: echo ".auditgate/" >> .git/info/exclude
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Instalar herramientas (aisladas con pipx; versiones de requirements-ci.txt)
        run: |
          pin() { grep -E "^$1(\[[^]]*\])?==" "$AG/.github/ci/requirements-ci.txt"; }
          pipx install "$(pin pip-audit)"
          pip install "$(pin pip-licenses)"
      - name: pip-audit diff-aware (gate en PR, reporte en push)
        env:
          REQS: ${{ inputs.requirements }}
        run: |
          read -ra FILES <<< "$REQS"
          if [ "$IS_PR" = "true" ]; then
            python "$AG/scripts/dep_gate.py" --base "$BASE_SHA" "${FILES[@]}"
          else
            python "$AG/scripts/dep_gate.py" "${FILES[@]}"
          fi
      - name: Licencias (reporte)
        env:
          REQS: ${{ inputs.requirements }}
        run: |
          read -ra FILES <<< "$REQS"
          for r in "${FILES[@]}"; do [ -f "$r" ] && pip install -q -r "$r" || true; done
          {
            echo "## 📄 Licencias"; echo '```'
            pip-licenses --format=plain --order=license
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  container:
    name: "🐳 Container"
    if: inputs.image-dockerfile != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build (sin push)
        run: docker build -t platform-scan:${{ github.sha }} -f "${{ inputs.image-dockerfile }}" "${{ inputs.image-context }}"

      - name: Trivy — reporte HIGH/CRITICAL (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: platform-scan:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Trivy — gate (CRITICAL con fix disponible)
        if: env.IS_PR == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: platform-scan:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Hadolint — todos los Dockerfiles (SARIF)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: "Dockerfile"
          recursive: true
          format: sarif
          output-file: hadolint.sarif
          no-fail: true

      - name: Upload SARIF (Trivy)
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Upload SARIF (Hadolint)
        if: always() && hashFiles('hadolint.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: hadolint.sarif
          category: hadolint
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sarif-container
          path: "*.sarif"
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────────────
  iac:
    name: "🏗️ IaC"
    if: inputs.iac-dir != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Auditgate (herramientas, version fijada)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.platform-repository }}
          ref: ${{ github.repository == inputs.platform-repository && github.sha || inputs.platform-ref }}
          path: .auditgate
          persist-credentials: false
          sparse-checkout: |
            .github/ci
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Instalar herramientas (aisladas con pipx; versiones de requirements-ci.txt)
        run: |
          pin() { grep -E "^$1(\[[^]]*\])?==" "$AG/.github/ci/requirements-ci.txt"; }
          pipx install "$(pin checkov)"
      - name: Checkov (reporte; siguiente paso = gate con --baseline)
        run: |
          checkov -d "${{ inputs.iac-dir }}" --framework terraform \
            -o sarif --output-file-path checkov-out --soft-fail
          mv checkov-out/results_sarif.sarif checkov.sarif
      - name: Upload SARIF (Checkov)
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: checkov.sarif
          category: checkov
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sarif-iac
          path: checkov.sarif
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────────────
  platform-integrity:
    name: "🧬 Rules + Tests + Pipeline integrity"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Auditgate (herramientas, version fijada)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.platform-repository }}
          ref: ${{ github.repository == inputs.platform-repository && github.sha || inputs.platform-ref }}
          path: .auditgate
          persist-credentials: false
          sparse-checkout: |
            rules
            .github/ci
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Instalar herramientas (aisladas con pipx; versiones de requirements-ci.txt)
        run: |
          pin() { grep -E "^$1(\[[^]]*\])?==" "$AG/.github/ci/requirements-ci.txt"; }
          pipx install "$(pin semgrep)"
          pip install "$(pin pytest)" "$(pin jsonschema)" "$(pin anthropic)" "$(pin openai)" "$(pin pyyaml)"

      - name: Las reglas del repo tienen tests y pasan (Codify)
        if: hashFiles('rules/**') != ''
        run: semgrep --test --metrics=off rules/

      - name: El pipeline se audita a si mismo (actions por SHA, sin pwn-request)
        if: hashFiles('.github/workflows/**') != ''
        env:
          ENFORCE: ${{ inputs.enforce-pinned-actions }}
        run: |
          FLAGS=(--config "$AG/rules/github-actions/" --metrics=off --include '.github/workflows/*')
          [ "$ENFORCE" = "true" ] && FLAGS+=(--error)
          semgrep scan "${FLAGS[@]}" .github/workflows/

      - name: Tests de seguridad (pytest)
        if: inputs.tests-path != ''
        env:
          TESTS: ${{ inputs.tests-path }}
        run: pytest "$TESTS" -q --junitxml=test-results.xml

  # ───────────────────────────────────────────────────────────────────────────
  # Capa AI — asesora, NO bloqueante. Solo PRs del mismo repo (los forks no
  # reciben secretos ni token OIDC, y su contenido es el de mayor riesgo de
  # prompt injection).
  #
  # El VAULT: el Environment `llm-environment` (por defecto `auditgate`). Su
  # secreto AUDITGATE_LLM_API_KEY esta cifrado por GitHub y SOLO lo recibe este
  # job (los escaneres nunca lo ven). Con Claude se puede no tener llave: WIF.
  ai-triage:
    name: "🤖 AI triage (advisory)"
    needs: [secrets, sast, container, iac]
    if: >-
      always() && inputs.ai-triage &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true # asesor por diseno: nunca rompe el pipeline
    environment: ${{ inputs.llm-environment }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write # solo para WIF con Claude (sin llave)
    env:
      AUDITGATE_LLM_PROVIDER: ${{ inputs.llm-provider }}
      AUDITGATE_LLM_MODEL: ${{ inputs.llm-model }}
      AUDITGATE_LLM_BASE_URL: ${{ inputs.llm-base-url }}
      ANTHROPIC_ORGANIZATION_ID: ${{ inputs.anthropic-organization-id }}
      ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.anthropic-federation-rule-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Auditgate (herramientas, version fijada)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.platform-repository }}
          ref: ${{ github.repository == inputs.platform-repository && github.sha || inputs.platform-ref }}
          path: .auditgate
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/ci
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: SDKs de modelos (versiones fijadas)
        run: |
          pin() { grep -E "^$1(\[[^]]*\])?==" "$AG/.github/ci/requirements-ci.txt"; }
          pip install "$(pin anthropic)" "$(pin openai)" "$(pin jsonschema)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sarif-*
          path: sarif
          merge-multiple: true
      - name: Variables WIF opcionales (solo si vienen; un "" vacio ocupa su lugar en la cadena de credenciales)
        env:
          SVAC: ${{ inputs.anthropic-service-account-id }}
          WRKSPC: ${{ inputs.anthropic-workspace-id }}
        run: |
          echo "ANTHROPIC_IDENTITY_TOKEN_FILE=$RUNNER_TEMP/gha-jwt" >> "$GITHUB_ENV"
          [ -n "$SVAC" ] && echo "ANTHROPIC_SERVICE_ACCOUNT_ID=$SVAC" >> "$GITHUB_ENV"
          [ -n "$WRKSPC" ] && echo "ANTHROPIC_WORKSPACE_ID=$WRKSPC" >> "$GITHUB_ENV"
          true
      - name: Triage de hallazgos del PR
        env:
          # La llave solo existe en este paso (GitHub la enmascara en los logs).
          AUDITGATE_LLM_API_KEY: ${{ secrets.AUDITGATE_LLM_API_KEY }}
        run: python "$AG/scripts/ai_triage.py" --sarif-dir sarif --base "$BASE_SHA" --out triage.md
      - name: Comentar en el PR (actualiza el comentario previo)
        if: hashFiles('triage.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file triage.md --edit-last --create-if-none

  # ───────────────────────────────────────────────────────────────────────────
  # Un solo check requerido para branch protection.
  security-gate:
    name: "🚦 Security Gate"
    needs: [secrets, sast, dependencies, container, iac, platform-integrity]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      gate: ${{ steps.eval.outputs.gate }}
    steps:
      - id: eval
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## 🚦 Security Gate"
            echo "| Control | Resultado |"
            echo "|---|---|"
            echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | `\(.value.result)` |"'
          } >> "$GITHUB_STEP_SUMMARY"
          # skipped = control no aplica (p. ej. sin Dockerfile); failure/cancelled = bloquea
          if echo "$RESULTS" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' >/dev/null; then
            echo "gate=failed" >> "$GITHUB_OUTPUT"
            echo "> 🚫 **Bloqueado** por la politica de seguridad." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "gate=passed" >> "$GITHUB_OUTPUT"
          echo "> ✅ Politica cumplida." >> "$GITHUB_STEP_SUMMARY"
