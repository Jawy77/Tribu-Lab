# =============================================================================
# DevSecOps Pipeline v2 — Bunker → Plataforma
# Tribu | Hacklab Bogota | Ethereum Bogota | Mantishield
#
# Este archivo es lo UNICO que un repo necesita: consume el reusable workflow
# de la plataforma (security-platform.yml) y agrega las notificaciones.
#
#   secrets ─┐
#   sast ────┤
#   deps ────┼──► 🚦 security-gate (unico check requerido) ──► notify
#   container┤                 ▲
#   iac ─────┤                 │ determinista: bloquea
#   integrity┘                 │
#   ai-triage ── comenta en el PR (asesor, nunca bloquea)
# =============================================================================
name: "🔒 DevSecOps Pipeline v2"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: "platform"
    uses: ./.github/workflows/security-platform.yml
    permissions:
      contents: read
      security-events: write # subir SARIF a Code Scanning
      pull-requests: write # solo para el comentario del agente de triage
      id-token: write # OIDC → Workload Identity Federation con Anthropic (sin API key)
    secrets: inherit # el job del agente recibe el secreto del Environment `auditgate`
    with:
      python-version: "3.12"
      requirements: "vulnerable_app/requirements.txt docker/openclaw/requirements.txt requirements.txt"
      image-dockerfile: "docker/app/Dockerfile"
      image-context: "."
      iac-dir: "terraform"
      tests-path: "tests/"
      ai-triage: true
      # Modelo del agente (variables del repo; la llave va en el Environment `auditgate`).
      llm-provider: ${{ vars.AUDITGATE_LLM_PROVIDER }}
      llm-model: ${{ vars.AUDITGATE_LLM_MODEL }}
      llm-base-url: ${{ vars.AUDITGATE_LLM_BASE_URL }}
      # IDs de WIF como *variables* del repo (no son secretos). Sin ellas, el triage se omite.
      anthropic-organization-id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      anthropic-federation-rule-id: ${{ vars.ANTHROPIC_RULE_ID_PR_TRIAGE }}
      anthropic-service-account-id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}

  notify:
    name: "📡 Notify"
    needs: platform
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      GATE: ${{ needs.platform.outputs.gate || 'failed' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      REF: ${{ github.ref_name }}
    steps:
      - name: Telegram
        if: env.TELEGRAM_BOT_TOKEN != ''
        run: |
          ICON=$([ "$GATE" = "passed" ] && echo "✅" || echo "🚨")
          MSG="🛡️ *Security Gate* ${ICON} \`${GATE}\`%0ARepo: \`${GITHUB_REPOSITORY}\`%0ABranch: \`${REF}\`%0ACommit: \`${GITHUB_SHA::7}\`%0A[Ver run](${RUN_URL})"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" -d text="${MSG}" -d parse_mode=Markdown \
            -d disable_web_page_preview=true > /dev/null
      - name: Discord
        if: env.DISCORD_WEBHOOK_URL != ''
        run: |
          COLOR=$([ "$GATE" = "passed" ] && echo 3066993 || echo 15158332)
          jq -n --arg t "Security Gate: ${GATE}" --arg u "$RUN_URL" --argjson c "$COLOR" \
            --arg r "$GITHUB_REPOSITORY" --arg b "$REF" --arg s "${GITHUB_SHA::7}" \
            '{embeds:[{title:$t,url:$u,color:$c,fields:[{name:"Repo",value:$r,inline:true},{name:"Branch",value:$b,inline:true},{name:"Commit",value:$s,inline:true}]}]}' \
          | curl -sS -X POST -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL" > /dev/null
