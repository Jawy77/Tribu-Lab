[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditgate-ci"
version = "0.2.0"
description = "Gate de seguridad determinista + agentes de IA (Claude, Grok, OpenAI...): el mismo motor en GitHub Actions y en tu terminal."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Jawy Romero (Mantishield)" }]
keywords = ["devsecops", "security", "github-actions", "semgrep", "supply-chain", "ai-agents"]
# El CLI solo usa la libreria estandar. Los motores de escaneo (opengrep, gitleaks,
# osv-scanner) son binarios que `auditgate setup` descarga y verifica por hash.
dependencies = []

[project.optional-dependencies]
ai = ["anthropic>=2.9", "openai>=3.54", "jsonschema>=4.26"]   # triage / audit con modelos
audit = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/Jawy77/auditgate"
Issues = "https://github.com/Jawy77/auditgate/issues"

[project.scripts]
auditgate = "auditgate.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["auditgate"]

[tool.setuptools.package-data]
auditgate = ["rules/**/*", "tools.json"]
