[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditgate-ci"
version = "0.1.0"
description = "CLI de Auditgate: instala un gate de seguridad determinista + agentes de IA (Claude, Grok, OpenAI...) en tu repo de GitHub."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Jawy Romero (Mantishield)" }]
keywords = ["devsecops", "security", "github-actions", "semgrep", "supply-chain", "ai-agents"]
dependencies = []  # solo libreria estandar + GitHub CLI (`gh`)

[project.urls]
Homepage = "https://github.com/Jawy77/auditgate"
Issues = "https://github.com/Jawy77/auditgate/issues"

[project.scripts]
auditgate = "auditgate_cli.main:main"

[tool.setuptools]
package-dir = { "" = "cli" }
packages = ["auditgate_cli"]
